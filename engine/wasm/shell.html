<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Star Control II</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      margin: auto;
      border: 0;
      background: #000;
      image-rendering: auto;
      outline: none;
      touch-action: none;
    }
    #engine-status {
      position: absolute;
      z-index: 2;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: min(86vw, 420px);
      color: #dffbff;
      font: 600 14px/1.5 "Segoe UI", sans-serif;
      text-align: center;
      pointer-events: none;
    }
    #engine-progress {
      width: 100%;
      height: 6px;
      margin-top: 12px;
      accent-color: #54d8ee;
    }
  </style>
</head>
<body>
  <div id="engine-status" hidden>
    <span id="engine-status-text">Loading Star Control II…</span>
    <progress id="engine-progress" value="0" max="100"></progress>
  </div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus(message) {
        const root = document.getElementById('engine-status');
        const text = document.getElementById('engine-status-text');
        const progress = document.getElementById('engine-progress');
        const match = message.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
        text.textContent = message || '';
        if (match) {
          progress.value = Number(match[1]) * 100;
          progress.max = Number(match[2]) * 100;
          progress.hidden = false;
        } else {
          progress.hidden = true;
        }
        // The parent page owns normal loading progress. Keep this fallback
        // invisible unless the embedded engine itself reports an error.
        root.hidden = !/^Game (?:content|engine) error:/.test(message);
      },
      monitorRunDependencies(left) {
        Module.setStatus(left ? `Loading game data… (${Module.totalDependencies - left}/${Module.totalDependencies})` : '');
      },
      totalDependencies: 0,
    };
    Module.setStatus('Loading game data…');
    const originalMonitor = Module.monitorRunDependencies;
    Module.monitorRunDependencies = (left) => {
      Module.totalDependencies = Math.max(Module.totalDependencies, left);
      originalMonitor(left);
    };
    window.addEventListener('error', (event) => {
      Module.setStatus(`Game engine error: ${event.message}`);
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
